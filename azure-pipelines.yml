# Azure DevOps pipeline: tests the backend and the frontend, then publishes the built frontend.
# Status: written but not yet executed (no Azure DevOps organisation connected to this repo).
# The tests never call the LLM API (fake extractor), so no secret is needed here.

trigger:
  branches:
    include: [main]

pr:
  branches:
    include: [main]

pool:
  vmImage: ubuntu-latest

stages:
  - stage: Test
    jobs:
      - job: Backend
        displayName: Backend (FastAPI + core)
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.11'
          - script: pip install -r requirements-app.txt
            displayName: Install dependencies
          - script: python -m pytest --junitxml=test-results/backend.xml
            displayName: Run tests
          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFiles: test-results/*.xml
              testRunTitle: Backend

      - job: Frontend
        displayName: Frontend (Angular)
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '18.x'
          - script: npm ci
            displayName: Install dependencies
            workingDirectory: frontend
          - script: npx ng test --watch=false --browsers=ChromeHeadless
            displayName: Run tests
            workingDirectory: frontend
          - script: npx ng build
            displayName: Build
            workingDirectory: frontend
          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: frontend/dist/frontend/browser
              artifact: frontend
